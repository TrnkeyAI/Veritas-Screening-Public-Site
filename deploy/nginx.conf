server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # /privacy is gated (siteConfig.sections.showPrivacyPolicy = false). Static
  # export still emits a 404 document at that path, so return a real 404 status
  # rather than serving that document with 200.
  location = /privacy   { return 404; }
  location ^~ /privacy/ { return 404; }

  location / { try_files $uri $uri/ $uri/index.html =404; }

  error_page 404 /404.html;
  location = /404.html { internal; }
}
